
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
:root{--g:#4caf50;--gdim:rgba(76,175,80,0.12);--y:#ffd600;--r:#e53935;--bg:#0d0d0d;--s1:#161616;--s2:#1e1e1e;--bd:rgba(76,175,80,0.25);--tx:#e8e8e8;--mu:#777;--fd:'Bebas Neue',sans-serif;--fb:'IBM Plex Sans',sans-serif;--fm:'IBM Plex Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body,.root{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:16px;}
.hdr{background:var(--s1);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;gap:12px;}
.hdr-logo{font-family:var(--fd);font-size:28px;color:var(--g);letter-spacing:2px;line-height:1;}
.hdr-logo span{color:var(--y);}
.hdr-meta{margin-left:auto;font-family:var(--fm);font-size:12px;color:var(--mu);text-align:right;line-height:1.6;}
.hdr-meta .handle{color:var(--g);font-size:14px;}
.drop-zone{margin:28px 20px;border:1.5px dashed var(--bd);border-radius:8px;padding:44px 20px;text-align:center;cursor:pointer;background:var(--s1);transition:border-color .2s,background .2s;}
.drop-zone:hover,.drag-over{border-color:var(--g)!important;background:var(--gdim)!important;}
.drop-zone i{font-size:36px;color:var(--g);margin-bottom:10px;display:block;}
.dz-title{font-family:var(--fd);font-size:22px;color:var(--g);letter-spacing:1px;margin-bottom:4px;}
.dz-sub{color:var(--mu);font-size:13px;}
.editor{display:none;}
.editor.active{display:block;}
.psbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:14px 20px;background:var(--s1);border-bottom:1px solid var(--bd);}
.psc{background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:9px 11px;}
.psc-l{font-size:11px;color:var(--mu);font-family:var(--fm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.psc-v{font-family:var(--fd);font-size:22px;color:var(--g);}
.tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 20px;background:var(--s1);gap:2px;}
.tab{font-family:var(--fd);font-size:16px;letter-spacing:1px;padding:12px 20px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--g);border-bottom-color:var(--g);}
.tc{display:none;padding:20px;}
.tc.active{display:block;}
.sec-title{font-family:var(--fd);font-size:19px;letter-spacing:1px;color:var(--g);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.btn-icon {width: 16px;height: 16px;pointer-events: none;}

/* ARTIFACTS */
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:11px;}
.art-card{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:16px 18px;display:flex;align-items:center;gap:14px;}
.art-card.owned{border-color:rgba(76,175,80,.4);}
.art-card.missing{border-color:rgba(255,214,0,.15);opacity:.75;}
.art-icon{width:46px;height:46px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--s2);}
.art-info{flex:1;min-width:0;}
.art-name{font-weight:500;font-size:15px;line-height:1.3;}
.art-desc{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.4;}
.art-id{font-family:var(--fm);font-size:10px;color:#555;margin-top:3px;}
.art-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.lv-disp{font-family:var(--fm);font-size:13px;color:var(--g);min-width:38px;text-align:center;background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:4px 5px;}
.lv-btn{background:var(--s2);border:1px solid var(--bd);color:var(--tx);width:30px;height:30px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s;padding:0;}
.lv-btn:hover{background:var(--gdim);border-color:var(--g);}
.add-btn{background:rgba(255,214,0,.08);border:1px solid rgba(255,214,0,.3);color:var(--y);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;font-family:var(--fm);transition:background .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.add-btn:hover{background:rgba(255,214,0,.18);}

/* COINS */
.coin-summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
.coin-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:18px;}
.coin-title{font-family:var(--fd);font-size:18px;letter-spacing:1px;margin-bottom:14px;}
.coin-title.dreamer{color:#a78bfa;}
.coin-title.dragon{color:#fb923c;}
.coin-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-family:var(--fm);padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.coin-row:last-child{border-bottom:none;}
.coin-row .lbl{color:var(--mu);}
.coin-row .val{color:var(--tx);}
.coin-available{margin-top:14px;display:flex;align-items:center;gap:10px;}
.coin-avail-label{font-family:var(--fm);font-size:12px;color:var(--mu);}
.coin-avail-input{font-family:var(--fd);font-size:26px;width:150px;background:var(--s2);border:1px solid var(--bd);border-radius:4px;padding:4px 10px;color:#a78bfa;}
.coin-avail-input.dragon{color:#fb923c;}
.coin-avail-input:focus{outline:none;border-color:var(--g);}

/* CHAR CARDS */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:10px;}
.char-card{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:14px;}
.char-name{font-family:var(--fd);font-size:16px;letter-spacing:1px;margin-bottom:10px;}
.char-stat{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.char-stat:last-child{border-bottom:none;}
.ck{color:var(--mu);}
.cvc{display:flex;align-items:center;gap:5px;}
.c-btn{background:var(--s2);border:1px solid var(--bd);color:var(--tx);width:26px;height:26px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:background .1s;font-size:16px;line-height:1;}
.c-btn:hover{background:var(--gdim);border-color:var(--g);}
.cv{font-family:var(--fm);font-size:13px;min-width:34px;text-align:center;}

/* COLLAPSIBLE SECTIONS */
.coll-section{margin-bottom:6px;border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.coll-header{font-family:var(--fd);font-size:16px;letter-spacing:1px;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--s2);user-select:none;}
.coll-header:hover{background:rgba(76,175,80,.08);}
.coll-arrow{font-size:12px;color:var(--mu);transition:transform .2s;}
.coll-header.open .coll-arrow{transform:rotate(180deg);}
.coll-body{display:none;padding:14px;}
.coll-body.open{display:block;}

/* BOSS UI */
.boss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;}
.boss-card{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;}
.boss-card-title{font-family:var(--fd);font-size:14px;letter-spacing:.5px;color:var(--mu);margin-bottom:10px;text-transform:uppercase;}
.boss-stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
.boss-stat-row:last-child{border-bottom:none;}
.bs-label{color:var(--mu);}
.bs-label.editable{color:var(--tx);}
.bs-val-wrap{display:flex;align-items:center;gap:5px;}
.bs-val{font-family:var(--fm);font-size:13px;min-width:34px;text-align:center;color:var(--g);}
.bs-val.computed{color:var(--mu);font-size:12px;}
.bs-btn{background:var(--s1);border:1px solid var(--bd);color:var(--tx);width:24px;height:24px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .1s;font-size:15px;line-height:1;}
.bs-btn:hover{background:var(--gdim);border-color:var(--g);}

/* POWER INJECT GRID */
.power-inject-section{margin-top:18px;}
.power-tree-block{margin-bottom:14px;}
.power-tree-title{font-family:var(--fd);font-size:15px;letter-spacing:1px;margin-bottom:8px;padding:4px 0;border-bottom:1px solid var(--bd);}
.power-inject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px;}
.pi-row{background:var(--s1);border:1px solid var(--bd);border-radius:5px;padding:8px 12px;display:flex;align-items:center;gap:8px;}
.pi-row.active{border-color:rgba(76,175,80,0.4);background:rgba(76,175,80,0.05);}
.pi-row.mapped{border-color:rgba(76,175,80,0.2);}
.pi-info{flex:1;min-width:0;}
.pi-name{font-size:13px;font-weight:500;line-height:1.2;}
.pi-sym{font-family:var(--fm);font-size:10px;color:#444;margin-top:2px;}
.pi-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.pi-lv{font-family:var(--fm);font-size:12px;min-width:30px;text-align:center;color:var(--g);}
.pi-lv.zero{color:#444;}

/* ROOM SEQUENCE */
.room-seq{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-bottom:18px;}
.room-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;}
.room-card.current{border-color:var(--g);background:rgba(76,175,80,0.06);}
.room-card.past{opacity:.4;}
.room-num{font-family:var(--fd);font-size:13px;color:var(--mu);letter-spacing:.5px;margin-bottom:6px;}
.room-num .current-tag{color:var(--g);font-size:11px;margin-left:6px;}
.room-field{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03);}
.room-field:last-child{border-bottom:none;}
.room-field label{color:var(--mu);font-family:var(--fm);}
.room-select{font-family:var(--fm);font-size:12px;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:2px 6px;}
.room-select:focus{outline:none;border-color:var(--g);}

.enh-row.enh-inactive{opacity:.45;}
.enh-row.enh-inactive:hover{opacity:.7;}
/* STATS */
.stat-search{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:5px;color:var(--tx);padding:9px 14px;font-family:var(--fm);font-size:14px;margin-bottom:14px;}
.stat-search:focus{outline:none;border-color:var(--g);}
.stat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:8px;}
.stat-row{background:var(--s1);border:1px solid var(--bd);border-radius:5px;padding:11px 14px;display:flex;align-items:center;gap:10px;}
.stat-key{font-family:var(--fm);font-size:12px;color:var(--mu);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-label{color:var(--tx);font-size:14px;display:block;margin-bottom:2px;}
.stat-val{font-family:var(--fm);font-size:14px;color:var(--g);width:90px;text-align:right;background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:5px 9px;}
.adv-toggle{font-family:var(--fm);font-size:12px;color:var(--mu);cursor:pointer;border:1px solid var(--bd);background:var(--s2);padding:5px 12px;border-radius:4px;margin-bottom:14px;}
.adv-toggle:hover{color:var(--tx);}
.adv-section{display:none;}
.adv-section.show{display:block;}

.run-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:22px;}
.run-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:18px;}
.run-card-title{font-family:var(--fd);font-size:18px;letter-spacing:1px;color:var(--g);margin-bottom:14px;}
.run-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.run-row:last-child{border-bottom:none;}
.run-lbl{color:var(--mu);font-family:var(--fm);}
.run-val{font-family:var(--fm);font-size:14px;color:var(--g);width:100px;text-align:right;background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:4px 8px;}
.run-val:focus{outline:none;border-color:var(--g);}
.run-select{font-family:var(--fm);font-size:13px;color:var(--g);background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:4px 8px;width:200px;text-align:right;}
.run-select:focus{outline:none;border-color:var(--g);}
.no-run{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--mu);text-align:center;gap:12px;}
.no-run i{font-size:48px;color:var(--bd);}
.no-run-title{font-family:var(--fd);font-size:24px;letter-spacing:2px;color:var(--mu);}
.enh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px;}
.enh-row{background:var(--s1);border:1px solid var(--bd);border-radius:5px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.enh-info{flex:1;min-width:0;}
.enh-sym{font-family:var(--fm);font-size:11px;color:var(--mu);}
.enh-name{font-size:13px;color:var(--tx);margin-bottom:2px;}
.enh-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.drop-zone.dz-loaded{padding:8px 20px;margin:0;border-radius:0;border-left:none;border-right:none;border-top:none;}
.drop-zone.dz-loaded .dz-title{display:none;}
.drop-zone.dz-loaded .dz-sub{display:none;}
.drop-zone.dz-loaded i{display:none;}
.drop-zone.dz-loaded::after{content:'drop a new save file here to reload';font-family:var(--fm);font-size:11px;color:var(--mu);}
.save-bar{position:sticky;bottom:0;background:var(--s1);border-top:1px solid var(--bd);padding:13px 20px;display:flex;align-items:center;gap:12px;}
.save-btn{background:var(--g);border:none;color:#000;padding:11px 24px;border-radius:5px;cursor:pointer;font-family:var(--fd);font-size:19px;letter-spacing:1px;transition:background .15s,transform .1s;}
.save-btn:hover{background:#66bb6a;}
.save-btn:active{transform:scale(.97);}
.save-btn:disabled{background:#2a2a2a;color:#555;cursor:not-allowed;}
.status{font-family:var(--fm);font-size:13px;color:var(--mu);}
.status.ok{color:var(--g);}
.status.err{color:var(--r);}
</style>

<div class="root" id="root">
<div class="hdr">
  <div class="hdr-logo">TMNT <span>SF</span> SAVE EDITOR</div>
  <div class="hdr-meta" id="hdr-meta">drop a save file to begin</div>
</div>
<div class="drop-zone" id="dz">
  <label for="fi" style="cursor:pointer;display:block;">

</div>
<div class="editor" id="editor">
  <div class="psbar" id="psbar"></div>

  </div>
  <div class="tc" id="tab-run">
    <div id="run-content"></div>
  </div>
  <div class="tc" id="tab-upgrades">
    <div id="upgrades-content"></div>
  </div>

    <div class="sec-title"><i class="ti ti-coin" aria-hidden="true"></i>Currency</div>

    <div class="sec-title"><i class="ti ti-users" aria-hidden="true"></i>Per character</div>
    <div class="char-grid" id="char-grid"></div>
    <div class="sec-title" style="margin-top:8px;"><i class="ti ti-chart-bar" aria-hidden="true"></i>Global stats</div>

      </div>
    </div>
  </div>
  <div class="save-bar">
    <button class="save-btn" id="save-btn" disabled>EXPORT SAVE</button>
    <span class="status" id="status">load a file to begin</span>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

}

// Replace slash-separated values with the one for the given level (1-3)
function powerDesc(name, level){
  const info=POWER_INFO[name];
  if(!info||!info[2])return '';
  const lv=Math.max(1,Math.min(3,level))-1;
  return info[2].replace(/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/g,(m,a,b,c)=>{
    return [a,b,c][lv];
  });
}

function coopInvs(){
  return (save.state.coop||[])
    .map(c=>c&&c.lifetime&&c.lifetime.artifact_inventory)
    .filter(inv=>inv&&inv.artifact_symbols&&inv.artifact_symbols.length>0);
}
function coopAddArtifact(symInt, lv){
  coopInvs().forEach(inv=>{
    if(!inv.artifact_symbols.includes(symInt)){
      inv.artifact_symbols.push(symInt);
      inv.artifact_levels.push(lv);
    }
  });
}
function coopRemoveArtifact(symInt){
  coopInvs().forEach(inv=>{
    const idx=inv.artifact_symbols.indexOf(symInt);
    if(idx!==-1){inv.artifact_symbols.splice(idx,1);inv.artifact_levels.splice(idx,1);}
  });
}
function coopSetLevel(symInt, lv){
  coopInvs().forEach(inv=>{
    const idx=inv.artifact_symbols.indexOf(symInt);
    if(idx!==-1) inv.artifact_levels[idx]=lv;
  });
}

function loadFile(file){
  origName=file.name;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const buf=new Uint8Array(e.target.result);
      const zOff=findZlib(buf);if(zOff===-1)throw new Error('No zlib stream found');
      const dec=pako.inflate(buf.slice(zOff));
      const js=new TextDecoder().decode(dec).replace(/\0+$/,'');
      save=JSON.parse(js);rawBuf=buf;zlibOff=zOff;dirty=false;
      // Build set of JSON paths whose values were floats (X.0) in the original
      origFloatPaths=new Set();
      buildFloatPaths(JSON.parse(js),'',origFloatPaths,js);
      render();setStatus('loaded: '+file.name,'ok');
    }catch(err){setStatus('error: '+err.message,'err');}
  };
  r.readAsArrayBuffer(file);
}

// Build a parallel structure from raw JSON that marks which numbers were floats.
// We walk the raw JSON string character by character alongside JSON.parse output.
function buildFloatPaths(obj,path,floatSet,rawJson){
  let pos=0;
  function skipWs(){while(pos<rawJson.length&&' \t\n\r'.includes(rawJson[pos]))pos++;}
  function parseValue(o,p){
    skipWs();
    const c=rawJson[pos];
    if(c==='"'){parseString();return;}
    if(c==='{'){parseObject(o,p);return;}
    if(c==='['){parseArray(o,p);return;}
    if(c==='t'){pos+=4;return;} // true
    if(c==='f'){pos+=5;return;} // false
    if(c==='n'){pos+=4;return;} // null
    // number
    const start=pos;
    if(rawJson[pos]==='-')pos++;
    while(pos<rawJson.length&&'0123456789'.includes(rawJson[pos]))pos++;
    let isFloat=false;
    if(pos<rawJson.length&&rawJson[pos]==='.'){isFloat=true;pos++;while(pos<rawJson.length&&'0123456789'.includes(rawJson[pos]))pos++;}
    if(pos<rawJson.length&&'eE'.includes(rawJson[pos])){isFloat=true;pos++;if('+-'.includes(rawJson[pos]))pos++;while(pos<rawJson.length&&'0123456789'.includes(rawJson[pos]))pos++;}
    if(isFloat&&p!=='')floatSet.add(p);
  }
  function parseString(){
    pos++; // opening "
    while(pos<rawJson.length){if(rawJson[pos]==='\\'){pos+=2;}else if(rawJson[pos]==='"'){pos++;return;}else pos++;}
  }
  function parseObject(o,p){
    pos++; // {
    skipWs();
    if(rawJson[pos]==='}'){pos++;return;}
    while(pos<rawJson.length){
      skipWs();
      const kstart=pos;
      parseString();
      const key=rawJson.slice(kstart+1,pos-1).replace(/\\(.)/g,'$1');
      skipWs();pos++; // :
      const cp=p?p+'.'+key:key;
      parseValue(o&&typeof o==='object'?o[key]:undefined,cp);
      skipWs();
      if(rawJson[pos]==='}'){pos++;return;}
      pos++; // ,
    }
  }
  function parseArray(o,p){
    pos++; // [
    skipWs();
    if(rawJson[pos]===']'){pos++;return;}
    let i=0;
    while(pos<rawJson.length){
      parseValue(Array.isArray(o)?o[i]:undefined,p+'['+i+']');
      i++;skipWs();
      if(rawJson[pos]===']'){pos++;return;}
      pos++; // ,
    }
  }
  parseValue(obj,'');
}

// Custom stringify that restores .0 on whole-number floats that were originally floats
function floatSafeStringify(obj,path){
  if(obj===null)return'null';
  if(typeof obj==='boolean')return obj?'true':'false';
  if(typeof obj==='string')return JSON.stringify(obj);
  if(typeof obj==='number'){
    if(Number.isInteger(obj)&&origFloatPaths&&origFloatPaths.has(path))return obj+'.0';
    return String(obj);
  }
  if(Array.isArray(obj)){
    return'['+obj.map((v,i)=>floatSafeStringify(v,path+'['+i+']')).join(',')+']';
  }
  if(typeof obj==='object'){
    const parts=[];
    for(const k of Object.keys(obj)){
      const p=path?path+'.'+k:k;
      parts.push(JSON.stringify(k)+':'+floatSafeStringify(obj[k],p));
    }
    return'{'+parts.join(',')+'}';
  }
  return String(obj);
}

function repack(){
  const js=floatSafeStringify(save,'')+'\0';
  const jb=new TextEncoder().encode(js);
  const comp=pako.deflate(jb,{level:6});
  const hdr=rawBuf.slice(0,zlibOff);
  // Compute MD5 over the actual bytes that get compressed (same as what game will decompress)
  const m=new TextEncoder().encode(md5bytes(jb));
  for(let i=0;i<32;i++)hdr[8+i]=m[i];
  const us=wLE(jb.length),cs=wLE(comp.length);
  for(let i=0;i<4;i++){hdr[41+i]=us[i];hdr[45+i]=cs[i];}
  const out=new Uint8Array(hdr.length+comp.length);
  out.set(hdr);out.set(comp,hdr.length);return out;
}

function exportSave(){
  try{
    const out=repack();
    const blob=new Blob([out],{type:'application/octet-stream'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=origName;a.click();
    dirty=false;setStatus('exported -- drop into your TMNTSF folder','ok');
  }catch(err){setStatus('export error: '+err.message,'err');}
}

function collapsible(title, colorHex, buildFn){
  const id='coll-'+Math.random().toString(36).slice(2);
  const wrap=document.createElement('div');wrap.className='coll-section';

  hdr.innerHTML=`<span style="color:${colorHex||'var(--mu)'}">${title}</span><span class="coll-arrow">&#9660;</span>`;
  const body=document.createElement('div');body.className='coll-body';
  hdr.addEventListener('click',()=>{hdr.classList.toggle('open');body.classList.toggle('open');});

function buildUpgradeGrid(gridId, upgrades, color){
  const grid=document.getElementById(gridId);
  if(!grid||!upgrades.length)return;
  // Map from buff_symbol to index in full upgrades array for editing
  const allUpgrades=save.state.lifetime.upgrades;
  upgrades.forEach(u=>{
    const globalIdx=allUpgrades.indexOf(u);
    const sym=String(u.buff_symbol);
    const known=UPGRADE_LOOKUP[sym];
    const label=known?known[0]:'Unknown ('+u.buff_symbol+')';
    const observedMax=UPGRADE_OBSERVED_MAX[sym]||999;
    const locked=known?known[4]===true:false;
    const desc=known?known[3](u.level):'';
    const row=document.createElement('div');row.className='enh-row';
    row.innerHTML=`
      <div class="enh-info">
        <div class="enh-name" style="${known?'':'color:var(--mu)'}">${label}${locked?' <span style="font-family:var(--fm);font-size:10px;color:var(--r);letter-spacing:.5px;">LOCKED</span>':''}</div>
        ${desc?`<div class="art-desc" id="upg-desc-${globalIdx}" style="margin-top:3px;">${desc}</div>`:''}
        <div class="enh-sym" style="margin-top:2px;">buff: ${u.buff_symbol}</div>
      </div>
      <div class="enh-ctrl">
        <button class="c-btn" data-gidx="${globalIdx}" data-d="-1"><img src="media/images/minus.png" alt="-" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">−</span></button>
        <span class="enh-lv" id="upg-lv-${globalIdx}">Lv ${u.level}</span>
        <button class="c-btn" data-gidx="${globalIdx}" data-d="1"><img src="media/images/plus.png" alt="+" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">+</span></button>
      </div>`;
    grid.appendChild(row);
  });
  grid.addEventListener('click',e=>{
    const btn=e.target.closest('[data-gidx]');if(!btn)return;
    const gi=parseInt(btn.dataset.gidx),d=parseInt(btn.dataset.d);
    const u=allUpgrades[gi];
    const sym=String(u.buff_symbol);
    const known=UPGRADE_LOOKUP[sym];
    const observedMax=UPGRADE_OBSERVED_MAX[sym]||999;
    const locked=known?known[4]===true:false;
    const cap=(upgradeAdvanced&&!locked)?99999:(known?known[2]:observedMax);
    u.level=Math.min(cap,Math.max(0,u.level+d));
    document.getElementById('upg-lv-'+gi).textContent='Lv '+u.level;
    const descEl=document.getElementById('upg-desc-'+gi);
    if(descEl&&known)descEl.textContent=known[3](u.level);
    markDirty();
  });
}

// Sync coop[3].run to match state.run (they must be identical mirrors)
function syncCoop(){
  if(!save||!save.state.coop)return;
  // Find coop slot that mirrors run (same enhancement set)
  const runSymSet=new Set(save.state.run.enhancements.map(e=>e.buff_symbol));
  for(let i=0;i<save.state.coop.length;i++){
    const c=save.state.coop[i];
    if(!c||!c.run||!c.run.enhancements||c.run.enhancements.length===0)continue;
    const cSymSet=new Set(c.run.enhancements.map(e=>e.buff_symbol));
    // If significant overlap (>50% match), this is the mirror slot
    const overlap=[...runSymSet].filter(s=>cSymSet.has(s)).length;
    if(overlap>runSymSet.size*0.5){
      // Deep copy run.enhancements to this coop slot
      c.run.enhancements=save.state.run.enhancements.map(e=>({...e}));
      return;
    }
  }
}

      <div class="run-card">

        <div class="run-row"><span class="run-lbl">Current HP</span><input class="run-val" id="run-hp" type="number" min="1" value="${Math.round(run.player_health)}"></div>
        <div class="run-row"><span class="run-lbl">Max HP</span><input class="run-val" id="run-maxhp" type="number" min="1" value="${Math.round(run.player_max_health)}"></div>
        <div class="run-row"><span class="run-lbl">Splinter Revives</span><input class="run-val" id="run-revives" type="number" min="0" max="9" value="${revives}"></div>
      </div>
      <div class="run-card">
        <div class="run-card-title">Resources</div>
        <div class="run-row"><span class="run-lbl">Scrap</span><input class="run-val" id="run-scrap" type="number" min="0" value="${scrapAvail}"></div>
        <div class="run-row"><span class="run-lbl">Lucky Dice</span><input class="run-val" id="run-dice" type="number" min="0" value="${diceAvail}"></div>
      </div>
      <div class="run-card">
        <div class="run-card-title">Artifact &amp; Tool</div>
        <div class="run-row"><span class="run-lbl">Artifact</span>
          <select class="run-select" id="run-art-sym">
            ${Object.keys(ARTIFACTS).map(s=>`<option value="${s}"${s===eqSym?' selected':''}>${ARTIFACTS[s][0]}</option>`).join('')}
          </select>
        </div>
        <div class="run-row"><span class="run-lbl">Artifact Lv</span><span style="font-family:var(--fm);font-size:13px;color:var(--g)">Lv ${eqArt.level}</span></div>
        <div class="run-row"><span class="run-lbl">Tool</span>
          <select class="run-select" id="run-tool-sym" style="color:#fb923c;">
            <option value="">None</option>
            ${Object.entries(ENHANCEMENTS).filter(([s,v])=>v[1]==='tool').map(([s,v])=>{
              const tname=v[0].match(/Tool \((.+?)\)/)?.[1]||v[0];
              return `<option value="${s}"${toolSym===s?' selected':''}>${tname}</option>`;
            }).join('')}
          </select>
        </div>
        <div class="art-desc" id="run-tool-desc" style="margin:2px 0 6px;font-size:11px;color:var(--mu);padding:0 4px;">${toolDesc}</div>
        ${toolEnh?`<div class="run-row"><span class="run-lbl">Tool Lv</span>
          <div style="display:flex;align-items:center;gap:5px;">
            <button class="c-btn" id="run-tool-dec"><img src="media/images/minus.png" alt="-" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">−</span></button>
            <span style="font-family:var(--fm);font-size:13px;color:#fb923c;min-width:34px;text-align:center;" id="run-tool-lv">Lv ${toolLevel}</span>
            <button class="c-btn" id="run-tool-inc"><img src="media/images/plus.png" alt="+" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">+</span></button>
          </div>
        </div>`:''}
      </div>
    </div>
    <div class="sec-title" style="margin-top:18px;"><i class="ti ti-map" aria-hidden="true"></i>Room sequence</div>
    <div class="room-seq" id="room-seq"></div>
    <div class="sec-title" style="margin-top:4px;"><i class="ti ti-bolt" aria-hidden="true"></i>Powers this run</div>

    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="save-btn" id="powers-zero-btn" style="background:var(--r);font-size:14px;padding:8px 18px;">ZERO ALL POWERS</button>
      <button class="save-btn" id="powers-max-btn" style="font-size:14px;padding:8px 18px;">MAX ALL POWERS</button>
    </div>
    <div id="enh-grid"></div>
`;

  // Build enhancements list — grouped by tree
  renderRoomSequence();
  const treeColor={'Astral (Dark)':'#a78bfa','Astral (Light)':'#e0c97f','Flame':'#f97316','Ninja':'#14b8a6',
                   'Ooze':'#7c3aed','Robotics':'#c0c0c0','Utrom':'#38bdf8','Water':'#3b82f6','Legendary':'#ffd600'};
  const catColor={'inspiration':'#a78bfa','tool':'#fb923c','power':'var(--g)','special':'#38bdf8'};
  const treeOrder=['Astral (Dark)','Astral (Light)','Flame','Ninja','Ooze','Robotics','Utrom','Water','Legendary'];

  function buildEnhGrid(){
    const container=document.getElementById('enh-grid');
    container.innerHTML='';

    // Build lookup: buff_symbol -> enhancement object (for active powers)
    const activeByName={};
    run.enhancements.forEach(e=>{
      const name=enhName(e.buff_symbol);
      if(name)activeByName[name]=e;
    });

    // Inspirations section (active only)
    const inspEnhs=run.enhancements.filter(e=>enhCat(e.buff_symbol)==='inspiration');
    if(inspEnhs.length){
      const kitSec=collapsible('Inspirations & Masteries ('+inspEnhs.length+')','var(--mu)',body=>{
        const g=document.createElement('div');g.className='enh-grid';body.appendChild(g);
        inspEnhs.forEach(e=>appendEnhRow(g,e));
      });
      kitSec.querySelector('.coll-header').click();
      container.appendChild(kitSec);
    }

    // Powers — render from POWER_INFO as master list, Lv0 if not in run
    treeOrder.forEach(tree=>{
      const treePowers=Object.entries(POWER_INFO).filter(([n,info])=>info[0]===tree);
      if(!treePowers.length)return;
      const color=treeColor[tree]||'var(--mu)';
      const activeCount=treePowers.filter(([n])=>activeByName[n]).length;
      const sec=collapsible(`${tree} (${activeCount}/${treePowers.length})`,color,body=>{
        const g=document.createElement('div');g.className='enh-grid';body.appendChild(g);
        treePowers.forEach(([name,info])=>{
          const active=activeByName[name];
          // Create a virtual enhancement object for display
          const eObj=active||{buff_symbol:null,level:0,_name:name};
          appendEnhRowFromInfo(g,name,info,eObj,active);
        });
      });
      sec.querySelector('.coll-header').click();
      container.appendChild(sec);
    });

    // Unknown powers in run (unmapped buff_symbols)
    const unknownPowers=run.enhancements.filter(e=>{
      const cat=enhCat(e.buff_symbol);
      if(cat==='inspiration'||cat==='tool')return false;
      const name=enhName(e.buff_symbol);
      return !name||!POWER_INFO[name];
    });
    if(unknownPowers.length){
      const sec=collapsible('Unknown in run ('+unknownPowers.length+') — buff_symbol not yet mapped','#555',body=>{
        const g=document.createElement('div');g.className='enh-grid';body.appendChild(g);
        unknownPowers.forEach(e=>appendEnhRow(g,e));
      });
      sec.querySelector('.coll-header').click();
      container.appendChild(sec);
    }

    // Injectable unmapped symbols
    const allMappedSyms=new Set(run.enhancements.map(e=>e.buff_symbol));
    const injectables=UNMAPPED_POWERS.filter(u=>!allMappedSyms.has(u.sym));
    if(injectables.length){
      const sec=collapsible('Add unmapped power to run ('+injectables.length+' available) — inject & load in-game to confirm','var(--y)',body=>{
        body.style.padding='10px 14px';
        const note=document.createElement('div');
        note.style.cssText='font-family:var(--fm);font-size:11px;color:var(--mu);margin-bottom:10px;';
        note.textContent='These buff_symbols have been seen in saves but not yet named. Add one to your run, export, load in-game, and tell me what appeared.';
        body.appendChild(note);
        const g=document.createElement('div');g.className='enh-grid';body.appendChild(g);
        injectables.forEach(u=>{
          const row=document.createElement('div');row.className='enh-row';
          row.innerHTML=`
            <div class="enh-info">
              <div class="enh-name" style="color:var(--mu);">Unknown (${u.sym})</div>
              <div class="enh-sym" style="margin-top:3px;"><span style="color:var(--y);font-size:10px;text-transform:uppercase;letter-spacing:.5px;">${u.hint||'unmapped'}</span> &middot; buff: ${u.sym}</div>
            </div>
            <div class="enh-ctrl">
              <button class="c-btn" data-inject="${u.sym}"><img src="media/images/plus.png" alt="+" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;"><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">+</span></button>
            </div>`;
          g.appendChild(row);
        });
        g.addEventListener('click',ev=>{
          const btn=ev.target.closest('[data-inject]');if(!btn)return;
          const sym=parseInt(btn.dataset.inject);
          const eSym=TOOL_ENH_SYMS[String(sym)]||0;
          run.enhancements.push({version:1,buff_symbol:sym,enhancement_symbol:eSym,level:1,aux:0,roomDuration:0});
          markDirty();buildEnhGrid();
        });
      });
      container.appendChild(sec);
    }
  }

  // Render a power row from POWER_INFO — handles both active (in run) and inactive (Lv0)
  function appendEnhRowFromInfo(grid,name,info,eObj,active){
    const tree=info[0];
    const unlock=info[1];
    const color=treeColor[tree]||'var(--mu)';
    const showUnlock=unlock&&unlock!=='Initial'&&unlock!=='Secondary';
    const lv=active?eObj.level:0;
    const desc=lv>0?powerDesc(name,lv):(info[2]?info[2].split('/')[0]:'');
    const isLocked=tree==='Legendary'||name.startsWith('Mastery');
    const symStr=active?` &middot; buff: ${eObj.buff_symbol}`:'';
    const lvStyle=lv===0?'color:#444':'';

    const row=document.createElement('div');
    row.className='enh-row'+(lv===0?' enh-inactive':'');
    row.dataset.powerName=name;
    row.innerHTML=`
      <div class="enh-info">
        <div class="enh-name" style="${lv===0?'color:#555':''}">${name}</div>
        <div class="art-desc" id="pdesc-${name.replace(/[^a-z0-9]/gi,'_')}" style="margin-top:3px;${lv===0?'color:#444':''}">${desc}</div>
        <div class="enh-sym" style="margin-top:3px;"><span style="color:${color};font-size:10px;text-transform:uppercase;letter-spacing:.5px;">${tree}</span>${showUnlock?' &middot; '+unlock:''}${symStr}</div>
      </div>
      <div class="enh-ctrl">
        <button class="c-btn" data-pname="${name}" data-d="-1" ${lv===0?'disabled style="opacity:.3"':''}><img src="media/images/minus.png" alt="-" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;"><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">−</span></button>
        <span class="enh-lv" id="plv-${name.replace(/[^a-z0-9]/gi,'_')}" style="${lvStyle}">${lv===0?'—':'Lv '+lv}</span>
        <button class="c-btn" data-pname="${name}" data-d="1" ${isLocked&&lv>=1?'disabled style="opacity:.3"':''}><img src="media/images/plus.png" alt="+" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;"><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">+</span></button>
      </div>`;
    grid.appendChild(row);
  }

  function appendEnhRow(grid,e){
    const origIdx=run.enhancements.indexOf(e);
    const known=enhName(e.buff_symbol);
    const cat=enhCat(e.buff_symbol);
    const pinfo=known?POWER_INFO[known]:null;
    const tree=pinfo?pinfo[0]:null;
    const unlock=pinfo?pinfo[1]:null;
    const label=known||`Unknown (${e.buff_symbol})`;
    const badgeColor=tree?treeColor[tree]:catColor[cat]||'var(--mu)';
    const badge=tree?tree:(cat==='inspiration'?'inspiration':cat==='tool'?'tool':'?');
    const showUnlock=unlock&&unlock!=='Initial'&&unlock!=='Secondary';
    const desc=known?powerDesc(known,e.level):'';
    const row=document.createElement('div');row.className='enh-row';
    row.innerHTML=`
      <div class="enh-info">
        <div class="enh-name" style="${known?'':'color:var(--mu)'}">${label}</div>
        ${desc?`<div class="art-desc" id="enh-desc-${origIdx}" style="margin-top:3px;">${desc}</div>`:''}
        <div class="enh-sym" style="margin-top:3px;"><span style="color:${badgeColor};font-size:10px;text-transform:uppercase;letter-spacing:.5px;">${badge}</span>${showUnlock?' &middot; '+unlock:''} &middot; buff: ${e.buff_symbol}</div>
      </div>
      <div class="enh-ctrl">
        <button class="c-btn" data-enh="${origIdx}" data-d="-1"><img src="media/images/minus.png" alt="-" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;"><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">−</span></button>
        <span class="enh-lv" id="enh-lv-${origIdx}">Lv ${e.level}</span>
        <button class="c-btn" data-enh="${origIdx}" data-d="1"><img src="media/images/plus.png" alt="+" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;"><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">+</span></button>
      </div>`;
    grid.appendChild(row);
  }

  buildEnhGrid();



  document.getElementById('powers-zero-btn').addEventListener('click',()=>{
    run.enhancements=run.enhancements.filter(e=>['inspiration','tool'].includes(enhCat(e.buff_symbol)));
    markDirty();buildEnhGrid();
  });

  document.getElementById('powers-max-btn').addEventListener('click',()=>{
    run.enhancements.forEach(e=>{
      if(enhCat(e.buff_symbol)!=='power')return;
      const name=enhName(e.buff_symbol);
      if(!name)return;
      const tree=POWER_INFO[name]?POWER_INFO[name][0]:null;
      if(tree==='Legendary')return; // legendaries locked at Lv1
      if(name.startsWith('Mastery'))return; // masteries locked at Lv1
      e.level=3;
    });
    markDirty();buildEnhGrid();
  });

  document.getElementById('enh-grid').addEventListener('click',e=>{
    const btn=e.target.closest('[data-pname]');
    if(btn){
      const name=btn.dataset.pname;
      const d=parseInt(btn.dataset.d);
      const info=POWER_INFO[name];if(!info)return;
      const isLocked=info[0]==='Legendary'||name.startsWith('Mastery');
      // Find buff_symbol for this power from ENHANCEMENTS reverse lookup
      const sym=Object.entries(ENHANCEMENTS).find(([s,v])=>v[0]===name)?.[0];
      const symInt=sym?parseInt(sym):null;
      const idx=symInt!==null?run.enhancements.findIndex(e=>e.buff_symbol===symInt):-1;
      if(d>0){
        if(idx>=0){
          if(!isLocked)run.enhancements[idx].level=Math.min(3,run.enhancements[idx].level+1);
        } else if(symInt!==null){
          const pEnhSym=POWER_ENH_SYMS[String(symInt)]||0;
          run.enhancements.push({version:1,buff_symbol:symInt,enhancement_symbol:pEnhSym,level:1,aux:0,roomDuration:0});
        }
      } else {
        if(idx>=0){
          const newLv=run.enhancements[idx].level-1;
          if(newLv<=0)run.enhancements.splice(idx,1);
          else run.enhancements[idx].level=newLv;
        }
      }
      markDirty();buildEnhGrid();return;
    }
    // Legacy: data-enh for unknown/insp rows
    const btn2=e.target.closest('[data-enh]');if(!btn2)return;
    const i=parseInt(btn2.dataset.enh),d=parseInt(btn2.dataset.d);
    const enh=run.enhancements[i];if(!enh)return;
    const newLv=enh.level+d;
    if(newLv<=0){
      run.enhancements.splice(i,1);
      markDirty();buildEnhGrid();return;
    }
    enh.level=Math.min(3,newLv);
    document.getElementById('enh-lv-'+i).textContent='Lv '+enh.level;
    const known=enhName(enh.buff_symbol);
    const descEl=document.getElementById('enh-desc-'+i);
    if(descEl&&known)descEl.textContent=powerDesc(known,Math.min(3,enh.level));
    markDirty();
  });
  document.getElementById('run-hp').addEventListener('change',e=>{
    run.player_health=Math.max(1,parseFloat(e.target.value)||1);markDirty();});
  document.getElementById('run-maxhp').addEventListener('change',e=>{
    run.player_max_health=Math.max(1,parseFloat(e.target.value)||1);markDirty();});
  document.getElementById('run-revives').addEventListener('change',e=>{
    const v=Math.max(0,parseInt(e.target.value)||0);
    if(!rs.revive_tokens)rs.revive_tokens={value:v,values:[{key:0,value:v}]};
    else{rs.revive_tokens.value=v;if(rs.revive_tokens.values?.length)rs.revive_tokens.values[0].value=v;}
    markDirty();});
  document.getElementById('run-scrap').addEventListener('change',e=>{
    const want=Math.max(0,parseInt(e.target.value)||0);
    if(!rs.coins)rs.coins={value:want,values:[{key:0,value:want}]};
    else{rs.coins.value=want;if(rs.coins.values?.length)rs.coins.values[0].value=want;}
    markDirty();});
  document.getElementById('run-dice').addEventListener('change',e=>{
    const want=Math.max(0,parseInt(e.target.value)||0);
    const spent=rs.spent_lucky_dice?Math.round(rs.spent_lucky_dice.value):0;
    const total=want+spent;
    if(!rs.lucky_dice)rs.lucky_dice={value:total,values:[{key:0,value:total}]};
    else{rs.lucky_dice.value=total;if(rs.lucky_dice.values?.length)rs.lucky_dice.values[0].value=total;}
    markDirty();});
  document.getElementById('run-art-sym').addEventListener('change',e=>{
    eqArt.artifact_symbol=parseInt(e.target.value);markDirty();});
  document.getElementById('run-tool-sym').addEventListener('change',e=>{
    const sym=parseInt(e.target.value);
    // Remove ALL existing tools from run first, then add selected one
    run.enhancements=run.enhancements.filter(e=>enhCat(e.buff_symbol)!=='tool');
    if(e.target.value!==''){
      const realEnhSym=POWER_ENH_SYMS[String(sym)]||TOOL_ENH_SYMS[String(sym)]||0;
      const newEnh={version:1,buff_symbol:sym,enhancement_symbol:realEnhSym,level:1,aux:0,roomDuration:0};
      run.enhancements.unshift(newEnh);
    }
    // Update description
    const rawName=ENHANCEMENTS[String(sym)]?.[0]||'';
    const tname=rawName.match(/Tool \((.+?)\)/)?.[1]||rawName;
    const desc=TOOLS[tname]||'';
    const descEl=document.getElementById('run-tool-desc');
    if(descEl)descEl.textContent=desc;
    markDirty();buildEnhGrid();});
  if(toolEnh){
    document.getElementById('run-tool-dec').addEventListener('click',()=>{
      toolEnh.level=Math.max(1,toolEnh.level-1);
      document.getElementById('run-tool-lv').textContent='Lv '+toolEnh.level;
      markDirty();});
    document.getElementById('run-tool-inc').addEventListener('click',()=>{
      toolEnh.level=Math.min(3,toolEnh.level+1);
      document.getElementById('run-tool-lv').textContent='Lv '+toolEnh.level;
      markDirty();});
  }


}

function renderRoomSequence(){
  if(!runActive())return;
  const lv=save['state']['level'];
  const rooms=lv['room_sequence_elements']||[];
  const curIdx=lv['current_room_sequence_index']||0;
  const container=document.getElementById('room-seq');
  if(!container)return;
  container.innerHTML='';

  const ROOM_TYPE_NAMES={2:'Start',3:'Reward',4:'Shop',5:'Boss',6:'Miniboss',7:'Challenge'};
  const REWARD_OPTS={2:'Forced Power',3:'Tool',9:'Scrap',11:'Coins',15:'Boss Reward',5:'Mixed'};
  const PORTAL_OPTS={0:'None',1:'Hard (red)',2:'Normal',3:'Shimmering',6:'?',7:'?',12:'?',14:'?'};

  rooms.forEach((room,i)=>{
    const isPast=i<curIdx;
    const isCurrent=i===curIdx;
    const typeName=ROOM_TYPE_NAMES[room.room_type]||('Type '+room.room_type);

    const card=document.createElement('div');
    card.className='room-card'+(isCurrent?' current':isPast?' past':'');

    // Build reward select options
    const rewardOpts=Object.entries(REWARD_OPTS).map(([v,n])=>
      `<option value="${v}"${room.reward==v?' selected':''}>${n}</option>`).join('');

    // Build portal select options
    const portalOpts=Object.entries(PORTAL_OPTS).map(([v,n])=>
      `<option value="${v}"${room.portal==v?' selected':''}>${n}</option>`).join('');

    card.innerHTML=`
      <div class="room-num">Room ${i+1} — ${typeName}${isCurrent?'<span class="current-tag">● CURRENT</span>':''}</div>
      <div class="room-field"><label>Reward</label>
        <select class="room-select" data-room="${i}" data-field="reward"${isPast?' disabled':''}>${rewardOpts}</select>
      </div>
      <div class="room-field"><label>Portal</label>
        <select class="room-select" data-room="${i}" data-field="portal"${isPast?' disabled':''}>${portalOpts}</select>
      </div>`;
    container.appendChild(card);
  });

  container.addEventListener('change',e=>{
    const sel=e.target.closest('[data-room]');if(!sel)return;
    const ri=parseInt(sel.dataset.room);
    const field=sel.dataset.field;
    rooms[ri][field]=parseInt(sel.value);
    markDirty();
  });
}

function renderArtifacts(){
  const inv=save.state.lifetime.artifact_inventory;
  const owned=inv.artifact_symbols.map(String);
  const ownedLvl={};owned.forEach((s,i)=>ownedLvl[s]=inv.artifact_levels[i]);
  const missing=Object.keys(ARTIFACTS).filter(s=>!owned.includes(s));
  const grid=document.getElementById('art-grid');grid.innerHTML='';

  const mk=(sym,isOwned)=>{
    const a=ARTIFACTS[sym]||['Unknown ('+sym+')',6,['']];
    const name=a[0],maxLv=a[1];
    const lv=isOwned?(ownedLvl[sym]||1):1;
    const desc=artDesc(sym,isOwned?lv:1);
    const imgSrc=`media/images/${Math.abs(parseInt(sym))}.png`;
    const d=document.createElement('div');d.className='art-card '+(isOwned?'owned':'missing');
    d.innerHTML=`
      <div class="art-icon"><img src="${imgSrc}" alt="" style="width:40px;height:40px;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><i class="ti ti-${isOwned?'shield':'lock'}" aria-hidden="true" style="font-size:22px;color:${isOwned?'var(--g)':'var(--y)'};display:none;width:100%;height:100%;align-items:center;justify-content:center;"></i></div>
      <div class="art-info">
        <div class="art-name">${name}</div>
        <div class="art-desc" id="desc${sym}">${desc}</div>
        <div class="art-id">${sym} &middot; max Lv ${maxLv}</div>
      </div>
      <div class="art-ctrl">
        ${isOwned?`
          <button class="lv-btn" data-s="${sym}" data-d="-1" title="decrease level"><img src="media/images/minus.png" alt="-" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">−</span></button>
          <span class="lv-disp" id="lv${sym}">Lv ${lv}</span>
          <button class="lv-btn" data-s="${sym}" data-d="1" title="increase level"><img src="media/images/plus.png" alt="+" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">+</span></button>
        `:`<button class="add-btn" data-s="${sym}" data-action="add">+ add</button>`}
      </div>`;
    grid.appendChild(d);
  };

  owned.forEach(s=>mk(s,true));missing.forEach(s=>mk(s,false));
}

function renderCharStats(){
  const st=save.state.lifetime.stats;
  const deathsArr=st.deaths?st.deaths.values||[]:[]; 
  const vicArr=st.victories?st.victories.values||[]:[]; 

  const grid=document.getElementById('char-grid');
  grid.innerHTML=CHARS.map(c=>{
    const dv=(deathsArr.find(x=>x.key===c.id)||{value:0}).value;
    const vv=(vicArr.find(x=>x.key===c.id)||{value:0}).value;
    const mkR=(lbl,val,uid)=>`
      <div class="char-stat">
        <span class="ck">${lbl}</span>
        <div class="cvc">
          <button class="c-btn" data-char="${c.name}" data-uid="${uid}" data-action="dec"><img src="media/images/minus.png" alt="-" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">−</span></button>
          <span class="cv" id="cv-${c.name}-${uid}">${Math.round(val)}</span>
          <button class="c-btn" data-char="${c.name}" data-uid="${uid}" data-action="inc"><img src="media/images/plus.png" alt="+" class="btn-icon" onerror="this.style.display=&apos;none&apos;;this.nextSibling.style.display=&apos;inline&apos;" ><span style="display:none;font-size:16px;line-height:1;pointer-events:none;">+</span></button>

    return `<div class="char-card">
      <div class="char-name" style="color:${c.color}">${c.name}</div>
      ${mkR('Shredder wins',sv(c.win),c.win)}
      ${mkR('Deaths',dv,'__deaths__')}
      ${mkR('Victories',vv,'__victories__')}
      ${mkR('Talismans',sv(c.tal),c.tal)}
      ${mkR('Wraps',sv(c.wrap),c.wrap)}
    </div>`;
  }).join('');
}

function recomputeShredder(){
  const byChar=CHARS.reduce((s,c)=>s+sv(c.win),0);
  setStat('stat_shredder_victory',byChar);
  setStat('stat_shredder_victory_any',byChar);
  setStat('stat_shredder_narrative_victory',byChar);
  ['bsv-stat_shredder_victory','bsv-stat_shredder_victory_any','bsv-stat_shredder_narrative_victory'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.textContent=byChar;
  });
}

function renderGlobalStats(){
  const st=save.state.lifetime.stats;
  const filter=(document.getElementById('ss')||{}).value?.toLowerCase()||'';
  const HIDE=new Set([...ADV_KEYS,...CHAR_STAT_KEYS,...BOSS_SECTIONS_KEYS]);

  const container=document.getElementById('stat-sections');
  const bossEl=document.getElementById('boss-sections');
  container.innerHTML='';
  if(bossEl)container.appendChild(bossEl);

  STAT_SECTIONS.forEach(section=>{
    const rows=section.keys.filter(([k,l])=>{
      if(HIDE.has(k))return false;
      if(!filter)return true;
      return k.includes(filter)||l.toLowerCase().includes(filter);
    });
    if(!rows.length)return;
    const sec=collapsible(section.title,'var(--mu)',body=>{
      const list=document.createElement('div');list.className='stat-list';body.appendChild(list);
      rows.forEach(([k,l])=>{
        const val=st[k]&&st[k].value!==undefined?Math.round(st[k].value):0;
        const row=document.createElement('div');row.className='stat-row';
        row.innerHTML=`<div class="stat-key"><span class="stat-label">${l}</span>${k}</div><input class="stat-val" type="number" value="${val}" data-key="${k}" step="1" min="0">`;
        list.appendChild(row);
        row.querySelector('input').addEventListener('change',e=>{
          const nv=parseFloat(e.target.value);if(isNaN(nv))return;
          setStat(k,nv);markDirty();
        });
      });
    });
    container.appendChild(sec);
  });

  const advKeys=Object.keys(st).filter(k=>ADV_KEYS.has(k));
  const advList=document.getElementById('adv-list');advList.innerHTML='';
  advKeys.forEach(k=>{
    const val=st[k]&&st[k].value!==undefined?Math.round(st[k].value):0;
    const row=document.createElement('div');row.className='stat-row';
    row.innerHTML=`<div class="stat-key"><span class="stat-label">${k.replace(/_/g,' ')}</span>${k}</div><input class="stat-val" type="number" value="${val}" data-key="${k}" step="1" min="0">`;
    advList.appendChild(row);
    row.querySelector('input').addEventListener('change',e=>{
      const nv=parseFloat(e.target.value);if(isNaN(nv))return;setStat(k,nv);markDirty();
    });
  });
}

document.getElementById('art-grid').addEventListener('click',e=>{
  if(!save)return;
  const add=e.target.closest('[data-action="add"]');
  const lb=e.target.closest('.lv-btn');
  const inv=save.state.lifetime.artifact_inventory;
  if(add){
    const sym=add.dataset.s;
    const symInt=parseInt(sym);
    inv.artifact_symbols.push(symInt);
    inv.artifact_levels.push(1);
    coopAddArtifact(symInt,1);
    markDirty();render();
  }
  if(lb){
    const sym=lb.dataset.s,dir=parseInt(lb.dataset.d);
    const symInt=parseInt(sym);
    const idx=inv.artifact_symbols.indexOf(symInt);
    if(idx!==-1){
      const newLv=inv.artifact_levels[idx]+dir;
      if(newLv<1){
        inv.artifact_symbols.splice(idx,1);inv.artifact_levels.splice(idx,1);
        coopRemoveArtifact(symInt);
        markDirty();render();return;
      }
      const lv=Math.min(artMaxLevel(sym),newLv);
      inv.artifact_levels[idx]=lv;
      coopSetLevel(symInt,lv);
      const lvEl=document.getElementById('lv'+sym);if(lvEl)lvEl.textContent='Lv '+lv;
      const descEl=document.getElementById('desc'+sym);if(descEl)descEl.textContent=artDesc(sym,lv);
      markDirty();
    }
  }
});

document.getElementById('char-grid').addEventListener('click',e=>{
  if(!save)return;
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const {char,uid,action}=btn.dataset;
  const delta=action==='inc'?1:-1;
  const c=CHARS.find(x=>x.name===char);if(!c)return;
  const st=save.state.lifetime.stats;
  if(uid==='__deaths__'){
    const arr=st.deaths?st.deaths.values:[];
    const found=arr.find(x=>x.key===c.id);
    const cur=found?found.value:0;const nv=Math.max(0,cur+delta);
    if(found)found.value=nv;else arr.push({key:c.id,value:nv});
    const el=document.getElementById(`cv-${char}-${uid}`);if(el)el.textContent=Math.round(nv);
  } else if(uid==='__victories__'){
    const arr=st.victories?st.victories.values:[];
    const found=arr.find(x=>x.key===c.id);
    const cur=found?found.value:0;const nv=Math.max(0,cur+delta);
    if(found)found.value=nv;else arr.push({key:c.id,value:nv});
    const el=document.getElementById(`cv-${char}-${uid}`);if(el)el.textContent=Math.round(nv);
  } else {
    const cur=sv(uid);const nv=Math.max(0,cur+delta);
    setStat(uid,nv);
    const el=document.getElementById(`cv-${char}-${uid}`);if(el)el.textContent=nv;
  }
  markDirty();
});

})();
</script>
